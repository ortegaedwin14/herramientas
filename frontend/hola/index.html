<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
     <link rel="stylesheet" href="src/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
  </head>
  <body>
    <div id="app">
      <h1>PING AL WEB SERVICE</h1>
      <div class="card">
        mensaje: <div id="mensaje"></div>
      </div>

      <input type="text" id="respuesta" placeholder="respuesta" >

      <button id="ping">ping</button>


    </div>

    <script>
      // Esperar a que el DOM se cargue completamente
      document.addEventListener("DOMContentLoaded", function() {
          // Seleccionar el botón por su ID
          const boton = document.getElementById("ping");
          
          // Agregar un evento de clic al botón
          boton.addEventListener("click", function() {
            getPingFromWebService()

          });
      });

      function getPingFromWebService(){
            const url = 'http://localhost:3000/pong'
            //Encadenar los datos de la url con la respuesta 
            fetch(url)
            .then((response) => {
              if (!response.ok) {
                throw new Error(`Error ${response.status}: ${response.statusText}`); // lanza un error si la respuesta no es exitosa
              }
              return response.json();
            })
            .then((data) => {
              console.log(data);
              document.getElementById("respuesta").value = data.message;
            })
            .catch((error) => {
              console.error('Error:', error); // muestra el error en la consola
              document.getElementById("respuesta").value = "Por favor verifica la URL."; // muestra un mensaje de error al usuario
            });
          }
    </script>
    <!-- <script type="module" src="/src/main.js"></script> -->
  
  </body>
</html>
